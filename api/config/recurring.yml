production:
  enqueue_hourly_job:
    class: "HourlyJob"
    queue: default
    schedule: "0 * * * *"

  enqueue_daily_job:
    class: "DailyJob"
    queue: default
    schedule: "0 5 * * *"

  enqueue_weekday_job:
    class: "WeekdayJob"
    queue: default
    schedule: "0 5 * * 1"

  enqueue_weekend_job:
    class: "WeekendJob"
    queue: default
    schedule: "0 5 * * 6"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12